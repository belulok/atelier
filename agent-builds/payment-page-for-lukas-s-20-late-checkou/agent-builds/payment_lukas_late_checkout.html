<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Payment for Late Checkout</title>

        .payment-container {

        .amount {
            font-size: 24px;

        }

            margin: 20px 0;

        }
        .pay-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        .pay-button:hover {
            background-color: #45a049;
        }
    </style>
</head>

    <div class="payment-container">
        <div class="amount">£20.00</div>
